version: '3.8'

# Local development Docker Compose configuration
# Includes Redis and Worker for local testing

services:
  redis:
    image: redis:7-alpine
    container_name: rag-anything-redis-local
    restart: unless-stopped
    # Bind to loopback only — otherwise an unauthenticated Redis is exposed
    # on every network the host can reach.
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    networks:
      - rag-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-anything-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-anything-api-local
    image: rag-anything-api:latest
    restart: unless-stopped
    
    ports:
      - "8000:8000"
    
    # User config (LLM/embedding/OpenAI keys, parser, logging) lives in .env —
    # same source as docker-compose.prod.yml so the two files cannot drift.
    # Only container wiring + structural flags are inlined below.
    env_file:
      - .env
    environment:
      # Server / path wiring (in-container, not user config)
      - HOST=0.0.0.0
      - PORT=8000
      - OUTPUT_DIR=/app/output
      - WORKING_DIR=/app/rag_storage
      - LOG_DIR=/app/logs
      - DISPLAY_CONTENT_STATS=true

      # Multimodal Processing
      - ENABLE_IMAGE_PROCESSING=true
      - ENABLE_TABLE_PROCESSING=true
      - ENABLE_EQUATION_PROCESSING=true

      # Redis Configuration (for message queue)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # Queue Configuration
      - MAX_CONCURRENT_FILES=${MAX_CONCURRENT_FILES:-1}

      # Rewrite `localhost` in client-supplied webhook_url to
      # `host.docker.internal` so callbacks reach services on the host.
      - DOCKER_NETWORKING=${DOCKER_NETWORKING:-true}

    depends_on:
      redis:
        condition: service_healthy

    volumes:
      # Persist output and storage
      - ./output:/app/output
      - ./rag_storage:/app/rag_storage
      - ./logs:/app/logs

      # Optional: Mount models cache to avoid re-downloading
      - rag_models_cache:/home/appuser/.cache

    networks:
      - rag-network

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rag-anything-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-anything-worker-local
    image: rag-anything-api:latest
    restart: unless-stopped
    command: ["python", "start_worker.py"]

    # User config lives in .env (shared with prod). Only wiring is inlined.
    env_file:
      - .env
    environment:
      # Path wiring (in-container)
      - OUTPUT_DIR=/app/output
      - WORKING_DIR=/app/rag_storage
      - LOG_DIR=/app/logs
      - DISPLAY_CONTENT_STATS=true

      # Multimodal Processing
      - ENABLE_IMAGE_PROCESSING=true
      - ENABLE_TABLE_PROCESSING=true
      - ENABLE_EQUATION_PROCESSING=true

      # Redis Configuration (for message queue)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # Queue Configuration
      - MAX_CONCURRENT_FILES=${MAX_CONCURRENT_FILES:-1}

      # Rewrite `localhost` in client-supplied webhook_url to
      # `host.docker.internal` so callbacks reach services on the host.
      - DOCKER_NETWORKING=${DOCKER_NETWORKING:-true}

    volumes:
      # Persist output and storage
      - ./output:/app/output
      - ./rag_storage:/app/rag_storage
      - ./logs:/app/logs
      
      # Optional: Mount models cache to avoid re-downloading
      - rag_models_cache:/home/appuser/.cache
      
    networks:
      - rag-network
    
    depends_on:
      redis:
        condition: service_healthy

volumes:
  rag_models_cache:
    driver: local
  redis_data_local:
    driver: local

networks:
  rag-network:
    driver: bridge
