version: '3.8'

# Local development Docker Compose configuration
# Includes Redis and Worker for local testing

services:
  redis:
    image: redis:7-alpine
    container_name: rag-anything-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    networks:
      - rag-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-anything-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-anything-api-local
    image: rag-anything-api:latest
    restart: unless-stopped
    
    ports:
      - "8000:8000"
    
    environment:
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000
      
      # RAG-Anything Configuration
      - PARSER=${PARSER:-mineru}
      - PARSE_METHOD=${PARSE_METHOD:-auto}
      - OUTPUT_DIR=/app/output
      - WORKING_DIR=/app/rag_storage
      - DISPLAY_CONTENT_STATS=true
      
      # Multimodal Processing
      - ENABLE_IMAGE_PROCESSING=true
      - ENABLE_TABLE_PROCESSING=true
      - ENABLE_EQUATION_PROCESSING=true
      
      # LLM Configuration
      - LLM_BINDING=${LLM_BINDING:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BINDING_HOST=${LLM_BINDING_HOST:-https://api.openai.com/v1}
      - LLM_BINDING_API_KEY=${LLM_BINDING_API_KEY}
      
      # Embedding Configuration
      - EMBEDDING_BINDING=${EMBEDDING_BINDING:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-large}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-3072}
      - EMBEDDING_BINDING_API_KEY=${EMBEDDING_BINDING_API_KEY}
      
      # Optional: OpenAI API key
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      
      # LightRAG Configuration
      - ENABLE_LIGHTRAG=${ENABLE_LIGHTRAG:-true}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VERBOSE=${VERBOSE:-false}
      - LOG_DIR=/app/logs
      
      # Redis Configuration (for message queue)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
      # Queue Configuration
      - MAX_CONCURRENT_FILES=${MAX_CONCURRENT_FILES:-1}
      
    depends_on:
      redis:
        condition: service_healthy
      
    volumes:
      # Persist output and storage
      - ./output:/app/output
      - ./rag_storage:/app/rag_storage
      - ./logs:/app/logs
      
      # Optional: Mount models cache to avoid re-downloading
      - rag_models_cache:/root/.cache
      
    networks:
      - rag-network
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rag-anything-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-anything-worker-local
    image: rag-anything-api:latest
    restart: unless-stopped
    command: ["python", "start_worker.py"]
    
    environment:
      # RAG-Anything Configuration
      - PARSER=${PARSER:-mineru}
      - PARSE_METHOD=${PARSE_METHOD:-auto}
      - OUTPUT_DIR=/app/output
      - WORKING_DIR=/app/rag_storage
      - DISPLAY_CONTENT_STATS=true
      
      # Multimodal Processing
      - ENABLE_IMAGE_PROCESSING=true
      - ENABLE_TABLE_PROCESSING=true
      - ENABLE_EQUATION_PROCESSING=true
      
      # LLM Configuration
      - LLM_BINDING=${LLM_BINDING:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BINDING_HOST=${LLM_BINDING_HOST:-https://api.openai.com/v1}
      - LLM_BINDING_API_KEY=${LLM_BINDING_API_KEY}
      
      # Embedding Configuration
      - EMBEDDING_BINDING=${EMBEDDING_BINDING:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-large}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-3072}
      - EMBEDDING_BINDING_API_KEY=${EMBEDDING_BINDING_API_KEY}
      
      # Optional: OpenAI API key
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      
      # LightRAG Configuration
      - ENABLE_LIGHTRAG=${ENABLE_LIGHTRAG:-true}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VERBOSE=${VERBOSE:-false}
      - LOG_DIR=/app/logs
      
      # Redis Configuration (for message queue)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
      # Queue Configuration
      - MAX_CONCURRENT_FILES=${MAX_CONCURRENT_FILES:-1}
    
    volumes:
      # Persist output and storage
      - ./output:/app/output
      - ./rag_storage:/app/rag_storage
      - ./logs:/app/logs
      
      # Optional: Mount models cache to avoid re-downloading
      - rag_models_cache:/root/.cache
      
    networks:
      - rag-network
    
    depends_on:
      redis:
        condition: service_healthy

volumes:
  rag_models_cache:
    driver: local
  redis_data_local:
    driver: local

networks:
  rag-network:
    driver: bridge
