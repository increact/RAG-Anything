version: "3.8"

# Production Docker Compose configuration for AWS Alma Linux 9
# This configuration is optimized for production deployment

services:
  redis:
    image: redis:7-alpine
    container_name: rag-anything-redis-prod
    restart: always
    volumes:
      - redis_data_prod:/data
    networks:
      - web_proxy
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          memory: "${REDIS_MEMORY_LIMIT:-256M}"
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-0.1}"
          memory: "${REDIS_MEMORY_RESERVATION:-128M}"

  rag-anything-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-anything-api-prod
    image: rag-anything-api:latest
    restart: always
    ports:
      - "8000"
    environment:
      - NODE_ENV=production
      - ENABLE_ACME=true
      - VIRTUAL_HOST=${VIRTUAL_HOST:-}
      # Redis Configuration (for message queue)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # Queue Configuration
      - MAX_CONCURRENT_FILES=${MAX_CONCURRENT_FILES:-1}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./rag_storage:/app/rag_storage
      - ./logs:/app/logs
      - rag_models_cache:/root/.cache
    networks:
      - web_proxy
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-1.0}"
          memory: "${MEMORY_LIMIT:-1.5G}"
        reservations:
          cpus: "${CPU_RESERVATION:-0.5}"
          memory: "${MEMORY_RESERVATION:-512M}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"

  rag-anything-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-anything-worker-prod
    image: rag-anything-api:latest
    restart: always
    mem_limit: ${WORKER_MEMORY_LIMIT:-5g}
    memswap_limit: ${WORKER_MEMSWAP_LIMIT:-7g}
    command: ["python", "start_worker.py"]
    env_file:
      - .env
    environment:
      # Redis Configuration (for message queue)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # Queue Configuration
      - MAX_CONCURRENT_FILES=${MAX_CONCURRENT_FILES:-1}
      - JOB_TIMEOUT=${JOB_TIMEOUT:-7200}

      # Memory optimisation: limit ML framework thread pools
      # Each extra thread allocates its own memory buffers; on 8GB EC2 this adds up fast
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-4}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-4}
      - TOKENIZERS_PARALLELISM=${TOKENIZERS_PARALLELISM:-false}
      # Force malloc to release freed memory back to OS immediately
      - MALLOC_TRIM_THRESHOLD_=${MALLOC_TRIM_THRESHOLD_:-100000}
      # MinerU model defaults: disable heavy formula/table models unless explicitly requested
      - MINERU_FORMULA_DEFAULT=${MINERU_FORMULA_DEFAULT:-false}
      - MINERU_TABLE_DEFAULT=${MINERU_TABLE_DEFAULT:-true}
    volumes:
      - ./output:/app/output
      - ./rag_storage:/app/rag_storage
      - ./logs:/app/logs
      - rag_models_cache:/root/.cache
    networks:
      - web_proxy
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-3.0}"
          memory: "${WORKER_MEMORY_LIMIT:-5G}"
        reservations:
          cpus: "${WORKER_CPU_RESERVATION:-1.0}"
          memory: "${WORKER_MEMORY_RESERVATION:-2G}"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"

volumes:
  rag_models_cache:
    driver: local
  redis_data_prod:
    driver: local

networks:
  web_proxy:
    external: true
